# referenceSystem CI - modelled on lsqvce's ci.yml, with one job lsqvce has
# no use for. The repository is PUBLIC, so matlab-actions licenses MATLAB for
# free and no MLM_LICENSE_TOKEN is needed; making it private would break the
# `matlab` job and nothing else.
#
# THREE GATES, CHEAPEST FIRST, and the first two need no MATLAB at all:
#   audit    auditPackage.py, stdlib only, seconds. Exits 1 on findings.
#   csuites  the five standalone C suites built with plain gcc. Handover
#            section C.4 requires rsCore.c to stay buildable without MATLAB;
#            this is where that requirement stops being a promise. It covers
#            rsCore, the ported IERS routines, the public C API, the
#            Chebyshev panels and the gateway logic - 237 assertions that
#            cost no licence and no minutes worth caring about.
#   matlab   the 590-test suite. Only reached when the cheap gates are green.
name: referenceSystem CI

on:
  push:
    branches: [main]   # the post-merge run on main (the DONE evidence)
  pull_request:        # ONE run per dev push, on the merge-preview commit.
                       # push-on-all-branches PLUS pull_request runs
                       # everything twice once a PR exists; lsqvce paid for
                       # that lesson on 2026-08-19 and this file inherits it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where may MATLAB run for this event: A8, a GitHub-hosted runner, or
  # nowhere? One decision for the whole organisation, in
  # astrobayer/ci-actions (ci-route; docs/CI_GUIDE.md section 2): members
  # only, no forks, A8 from a public repository only for the allow-listed
  # user. This job never fails - a refusal arrives in the MATLAB job as
  # runner=none and matlab-setup turns that required context red.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      runs-on: ${{ steps.route.outputs.runs-on }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - id: route
        uses: astrobayer/ci-actions/ci-route@v1.4.0
        with:
          policy: ${{ vars.CI_MATLAB_RUNNER }}
          request: ${{ github.event.inputs.runner }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # fetch-depth 0: the version-bump check compares Contents.m with the
        # newest vX.Y.Z tag and with the base branch (HEAD^1 of the merge
        # preview). A shallow checkout has neither, and the check refuses it
        # (version/bumpNoTags) rather than passing every pull request.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      # No pip install: auditPackage.py imports os, re, sys and collections
      # and nothing else. Verified against the source, not assumed.
      - run: python3 auditPackage.py

  csuites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sh test/c/runStandaloneTests.sh
      # fundargIers.csv is a BUILD PRODUCT of testIersModels and TestTime
      # reads it (obligation O3). Keeping the CI copy makes it possible to
      # compare the runner's D27 sweep against the one under revision
      # control when the two ever disagree.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fundargIersSweep
          path: test/fixtures/fundargIers.csv

  matlab:
    needs: [audit, csuites, route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: 60        # backstop: no wedge sits for hours
    env:
      REFERENCESYSTEM_CI: 1    # read by referenceSystemCiGate; the ONE CI policy switch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # D133: DOWNLOADS GO TO THE DATA POOL, NEVER INTO THE CHECKOUT. The
      # organisation's DATA_POOL.md gives every toolbox one pool root, read
      # from DATAPOOL, with the kernels in <pool>/SPICE and the EOP series in
      # <pool>/EOP. This step decides the root ONCE for the job and exports
      # it: the repository variable REF_DATA_POOL where it is set (a
      # self-hosted machine holding the 701 MB once), otherwise a folder in
      # the runner's temp area that the cache below fills. Either way nothing
      # lands in data/, whose two committed EOP tables stay as they are.
      #
      # REF_DATA_POOL NOW NAMES THE POOL ROOT, NOT A PER-TOOLBOX FOLDER. Its
      # kernels are read from <REF_DATA_POOL>/SPICE. Until the files on the
      # runner machine have been moved there by hand, the gate's
      # Fetch="kernels" simply downloads them into that folder once; nothing
      # fails, it only costs one transfer.
      #
      # Passed through env rather than interpolated into the command text:
      # a path containing spaces cannot break the script.
      - name: Choose the data pool
        shell: powershell
        env:
          REF_DATA_POOL: ${{ needs.route.outputs.runner == 'a8' && vars.REF_DATA_POOL || '' }}
        run: |
          if ($env:REF_DATA_POOL) { $pool = $env:REF_DATA_POOL }
          else { $pool = Join-Path $env:RUNNER_TEMP 'datapool' }
          # .NET writes UTF-8 WITHOUT a byte-order mark; Windows PowerShell's
          # Out-File -Encoding utf8 would prefix one to the variable's name.
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DATAPOOL=$pool`n")
          Write-Output "data pool: $pool"

      # <pool>/SPICE IS EXACTLY WHAT A FETCH WRITES, so caching that folder
      # caches the kernels and nothing else. Keyed on downloadKernels.m
      # because the catalogue lives inside it: change the catalogue, lose the
      # cache.
      #
      # MEASURED AT RUN 1, NOT ESTIMATED: the six kernels come to about
      # 660 MB, of which sb441-n16.bsp alone is 615.8 MB. The catalogue's own
      # approximateBytes row said 650e6 for it and was right.
      #
      # RESTORE AND SAVE ARE SPLIT, AND THE SAVE RUNS ON A RED JOB. Runs 1
      # and 2 both fetched all six kernels from NAIF and JPL because the
      # combined action's post step was skipped when the job failed, so a
      # red run paid 660 MB of somebody else's bandwidth and left nothing
      # behind for the next one. `if: always()` is what stops that.
      #
      # SUPERSEDED WHEN REF_DATA_POOL IS SET. A self-hosted pool persists
      # between runs; restoring 660 MB from GitHub's cache over it would be
      # traffic for nothing. Both cache steps therefore stand down when the
      # variable is set.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ (needs.route.outputs.runner == 'a8' && vars.REF_DATA_POOL || '') == '' }}
        id: kernelCache
        with:
          path: ${{ env.DATAPOOL }}/SPICE
          key: rsPoolKernels-${{ hashFiles('+referenceSystem/downloadKernels.m') }}

      # matlab-setup (it replaced the probe on 2026-11-13) and the reasoning
      # behind both live in astrobayer/ci-actions. Six repositories carried this step
      # byte-for-byte identically, and a copied step is what let one
      # editing mistake cost three repositories a checkout each.
      #
      # PINNED TO AN IMMUTABLE TAG, not @v1 and not @main: a moving tag
      # would let a commit in ci-actions change this repository's CI with
      # nothing in its diff to explain it.
      #
      # timeout-minutes sits here and not in the action: GitHub's
      # composite-action schema rejects the key on a step.
      # MATLAB on the routed runner: probed on A8, installed by setup-matlab on a
      # GitHub-hosted runner (public repositories only), or a red step quoting
      # the routing refusal. Replaces matlab-probe; same immutable-tag rule.
      - uses: astrobayer/ci-actions/matlab-setup@v1.4.0
        timeout-minutes: 15
        with:
          runner: ${{ needs.route.outputs.runner }}
          reason: ${{ needs.route.outputs.reason }}
          products: ${{ vars.CI_MATLAB_PRODUCTS }}

      # THE STORED PREFERENCE IS DISCARDED, NOT SET (3.0.1). referenceSystem.
      # dataFolder ranks a stored preference above DATAPOOL, and setpref is
      # per USER: on a self-hosted machine it OUTLIVES THE JOB. Until 3.0.1
      # this step stored the job's pool, so every later job of every other
      # repository on the same account inherited this repository's
      # REF_DATA_POOL - NonGravForces #141 (2026-11-09) passed a test for
      # months only because that folder held its EOP file flat, and went red
      # when the test read the pool layout. A reset leaves no state behind and
      # lets DATAPOOL, exported above, answer; the assert below proves it did.
      #
      # Reported as a named list against downloadKernels' own catalogue,
      # because a pool that is absent and a pool with the wrong layout both
      # end as a silent re-download and are otherwise indistinguishable.
      - name: Point referenceSystem.dataFolder at the data pool
        timeout-minutes: 5
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: |
            addpath(pwd);
            pool = string(getenv("DATAPOOL"));
            assert(strlength(pool) > 0, 'referenceSystem:ci:dataPoolMissing', ...
                'DATAPOOL is not set; the "Choose the data pool" step exports it.');
            referenceSystem.dataFolder("reset");
            [root, location] = referenceSystem.dataFolder();
            assert(location.source == "DATAPOOL", 'referenceSystem:ci:poolNotFromDatapool', ...
                'After the reset the pool must come from DATAPOOL, not %s.', location.source);
            fprintf('data pool: %s (from %s)\n', root, location.source);
            fprintf('kernels  : %s\n', location.SPICE);
            want = ["de440s.bsp"
                    "pck00011.tpc"
                    "pck00011_n0066.tpc"
                    "moon_pa_de440_200625.bpc"
                    "moon_de440_250416.tf"
                    "sb441-n16.bsp"];
            for k = 1:numel(want)
                f = fullfile(location.SPICE, want(k));
                if isfile(f)
                    d = dir(f);
                    fprintf('  FOUND   %-28s %11d B\n', want(k), d.bytes);
                else
                    fprintf('  ABSENT  %s\n', want(k));
                end
            end
            % de440.bsp is catalogued but only fetched for KernelSet="all"
            % with a long span; referenceSystemCiGate asks for "short". Reported, not
            % required, so its absence is not read as a broken pool.
            fprintf('  optional de440.bsp present: %d\n', ...
                isfile(fullfile(location.SPICE, "de440.bsp")));
            % The EOP tables the suite needs are COMMITTED in data/ and are
            % not fetched by the gate; the pool's EOP/ is reported, not needed.
            fprintf('  pool EOP folder present: %d\n', isfolder(location.EOP));
            % MICE is optional: TestBodyFrames assumes it and skips when it
            % is missing. Whether the runner account has it on the path has
            % never been measured, and a skipped tier looks like a passing
            % one in the summary.
            fprintf('  MICE on path: %d\n', exist('cspice_tkvrsn', 'file') > 0);

      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: |
            issues = codeIssues(pwd);
            if ~isempty(issues.Issues)
                disp(issues.Issues(:, ["Location" "Severity" "CheckID" "Description"]));
                error("codeAnalyzer:findings", "%d Code Analyzer finding(s).", ...
                    height(issues.Issues));
            end
            disp("Code Analyzer: clean");

      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          # Renamed from ciGate at rev. 1.229: a sibling project's ciGate.m
          # won on the development machine's path and kept the local gate red.
          command: referenceSystemCiGate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()           # the report is wanted MOST when the run is red
        with:
          name: referenceSystemTestReport
          path: referenceSystem_testReport.txt

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ always() && (needs.route.outputs.runner == 'a8' && vars.REF_DATA_POOL || '') == '' && steps.kernelCache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.DATAPOOL }}/SPICE
          key: rsPoolKernels-${{ hashFiles('+referenceSystem/downloadKernels.m') }}
